# Local, cloud-native-style stack: detector + Prometheus scraping its /metrics.
# `docker compose up --build` brings both up. Grafana can be added the same way.

services:
  detector:
    build: ./detection_service
    image: ics-detector:local
    container_name: ics-detector
    ports:
      - "8000:8000"
    volumes:
      # Mount trained artifacts read-only so you can swap models without rebuilding.
      - ./detection_service/artifacts:/app/artifacts:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: ics-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - detector
    restart: unless-stopped

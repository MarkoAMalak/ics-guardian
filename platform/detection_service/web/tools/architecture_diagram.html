<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>System Architecture - ICS Anomaly Detection Platform</title>
<style>
body{margin:0;background:#f4f7fb;font-family:'Segoe UI',system-ui,sans-serif;padding:24px}
h1{font-size:20px;color:#1F5C8B;margin:0 0 4px}
.sub{color:#5b6b7d;font-size:13px;margin-bottom:16px}
svg{width:100%;height:auto;display:block;background:#fff;border:1px solid #dde6f0;border-radius:12px}
</style></head><body>
<h1>Cloud-Native DevSecOps Platform - Process/Network Anomaly Detection</h1>
<div class="sub">Five integrated layers, with the process-network fusion detector at the core. Trained unsupervised on normal behaviour only.</div>
<svg viewBox="0 0 1160 720" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5b7690"/>
    </marker>
    <style>
      .lbl{fill:#1F5C8B;font-weight:700;font-size:13px}
      .box{fill:#fff;stroke:#9db6d0;stroke-width:1.4;rx:9}
      .t{fill:#2b3a4a;font-size:12.5px}
      .tt{fill:#1a2836;font-size:12.5px;font-weight:600}
      .sm{fill:#5b6b7d;font-size:11px}
      .layer{fill:#eef4fb;stroke:#cfe0f0;stroke-width:1}
    </style>
  </defs>

  <!-- Layer A: Data -->
  <rect class="layer" x="20" y="20" width="1120" height="96" rx="10"/>
  <text class="lbl" x="34" y="42">A · Data Sources</text>
  <rect class="box" x="40" y="52" width="210" height="50" rx="9"/><text class="tt" x="54" y="74">SWaT process (81 sensors)</text><text class="sm" x="54" y="91">normal + attack, 1 Hz</text>
  <rect class="box" x="270" y="52" width="230" height="50" rx="9"/><text class="tt" x="284" y="74">SWaT A6 network (pcap)</text><text class="sm" x="284" y="91">EtherNet/IP, 15 captures, 320M pkts</text>
  <rect class="box" x="520" y="52" width="190" height="50" rx="9"/><text class="tt" x="534" y="74">WADI (98 sensors)</text><text class="sm" x="534" y="91">process only</text>

  <!-- Layer B: Collection -->
  <rect class="layer" x="20" y="132" width="1120" height="96" rx="10"/>
  <text class="lbl" x="34" y="154">B · Data Collection &amp; Alignment</text>
  <rect class="box" x="40" y="164" width="250" height="50" rx="9"/><text class="tt" x="54" y="186">Network feature extractor</text><text class="sm" x="54" y="203">pkt/byte rate, IAT, topology, ICS pkts</text>
  <rect class="box" x="310" y="164" width="230" height="50" rx="9"/><text class="tt" x="324" y="186">Normalization</text><text class="sm" x="324" y="203">clean · feature-select · window</text>
  <rect class="box" x="560" y="164" width="250" height="50" rx="9"/><text class="tt" x="574" y="186">Time alignment (per second)</text><text class="sm" x="574" y="203">GMT+8 ↔ UTC · shared labels</text>

  <!-- Layer C: Detection (core) -->
  <rect class="layer" x="20" y="244" width="1120" height="216" rx="10"/>
  <text class="lbl" x="34" y="266">C · Detection Layer - unsupervised (train on normal only)</text>

  <!-- baseline models -->
  <rect class="box" x="40" y="286" width="150" height="44" rx="9"/><text class="t" x="54" y="313">Isolation Forest</text>
  <rect class="box" x="40" y="340" width="150" height="44" rx="9"/><text class="t" x="54" y="367">Dense-AE · LSTM-AE</text>
  <rect class="box" x="40" y="394" width="150" height="44" rx="9"/><text class="t" x="54" y="421">USAD · TranAD · GDN</text>
  <text class="sm" x="40" y="452">SWaT &amp; WADI benchmark (process)</text>

  <!-- fusion block -->
  <rect x="330" y="282" width="520" height="164" rx="11" fill="#eaf3fb" stroke="#1F5C8B" stroke-width="1.6"/>
  <text class="lbl" x="346" y="304">Process-Network Fusion (SWaT A6)</text>
  <rect class="box" x="350" y="316" width="180" height="48" rx="9"/><text class="tt" x="364" y="338">Process branch (AE)</text><text class="sm" x="364" y="355">catches disruption</text>
  <rect class="box" x="350" y="376" width="180" height="48" rx="9"/><text class="tt" x="364" y="398">Network branch (AE)</text><text class="sm" x="364" y="415">catches exfiltration</text>
  <rect x="600" y="344" width="230" height="56" rx="9" style="fill:#1F5C8B;stroke:#1F5C8B;stroke-width:1.4"/>
  <text x="614" y="369" style="fill:#ffffff;font-size:13px;font-weight:700">Fusion (max score / OR)</text>
  <text x="614" y="388" style="fill:#cfe4f6;font-size:11px">best ROC-AUC 0.78 · catches both</text>
  <path d="M530,340 L598,360" stroke="#5b7690" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <path d="M530,400 L598,382" stroke="#5b7690" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <!-- Layer D: Cloud -->
  <rect class="layer" x="20" y="476" width="1120" height="96" rx="10"/>
  <text class="lbl" x="34" y="498">D · Cloud Layer</text>
  <rect class="box" x="40" y="508" width="230" height="50" rx="9"/><text class="tt" x="54" y="530">Inference service (REST)</text><text class="sm" x="54" y="547">scaler + model weights</text>
  <rect class="box" x="290" y="508" width="230" height="50" rx="9"/><text class="tt" x="304" y="530">Live dashboard</text><text class="sm" x="304" y="547">real-time score · attack timeline</text>
  <rect class="box" x="540" y="508" width="200" height="50" rx="9"/><text class="tt" x="554" y="530">Alerting &amp; audit trail</text><text class="sm" x="554" y="547">operator notifications</text>

  <!-- Layer E: DevSecOps (right column) -->
  <rect x="880" y="244" width="240" height="328" rx="10" fill="#fdf6ea" stroke="#e1a140" stroke-width="1.3"/>
  <text x="896" y="266" fill="#b5791f" font-size="13" font-weight="700">E · DevSecOps</text>
  <text class="sm" x="896" y="288">CI/CD pipeline gates:</text>
  <rect class="box" x="896" y="298" width="208" height="40" rx="8"/><text class="t" x="910" y="323">SAST (static)</text>
  <rect class="box" x="896" y="344" width="208" height="40" rx="8"/><text class="t" x="910" y="369">DAST (dynamic)</text>
  <rect class="box" x="896" y="390" width="208" height="40" rx="8"/><text class="t" x="910" y="415">Dependency scan</text>
  <rect class="box" x="896" y="436" width="208" height="40" rx="8"/><text class="t" x="910" y="461">Container image scan</text>
  <text class="sm" x="896" y="498">Secures the platform itself -</text>
  <text class="sm" x="896" y="514">"practise what we enforce".</text>

  <!-- vertical flow arrows -->
  <path d="M580,116 L580,130" stroke="#5b7690" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M580,228 L580,242" stroke="#5b7690" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M580,460 L580,474" stroke="#5b7690" stroke-width="1.6" marker-end="url(#ar)"/>
</svg>
</body></html>

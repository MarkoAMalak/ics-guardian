<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Media · ICS Guardian</title>
<link rel="icon" href="assets/logo.svg"/>
<link rel="stylesheet" href="assets/app.css?v=9"/>
<script>
/* Auth gate: runs before the page paints so protected content never flashes.
   - not logged in            -> everything except login/register redirects to login
   - logged in on login/reg   -> bounce to home
   - admin-only pages         -> operators are sent to their account page          */
document.documentElement.style.visibility='hidden';
(function(){
  try{
    var page=(location.pathname.split('/').pop()||'index.html');
    var PUBLIC={'login.html':1,'register.html':1};
    // admin-only pages: the admin panel + the tabs operators are not allowed to see
    var ADMIN={'admin.html':1,'architecture.html':1,'devsecops.html':1,'media.html':1};
    var tok=sessionStorage.getItem('icsg_token'), user=null;
    try{ user=JSON.parse(sessionStorage.getItem('icsg_user')||'null'); }catch(e){}
    function show(){ document.documentElement.style.visibility=''; }
    if(PUBLIC[page]){ if(tok){ location.replace('index.html'); return; } return show(); }
    if(!tok){ location.replace('login.html'); return; }
    if(ADMIN[page] && (!user || user.role!=='admin')){ location.replace(page==='admin.html'?'account.html':'index.html'); return; }
    show();
  }catch(e){ document.documentElement.style.visibility=''; }
})();
</script></head><body>
<main>
  <div class="pagehead"><h1>Media</h1><p>The narrated plant-simulation video and the one-page project poster.</p></div>
  <h2 class="sec">Plant simulation (narrated)</h2>
  <div class="card">
    <video controls style="width:100%;border-radius:10px;background:#000" src="tools/ICS_Plant_Simulation_Narrated_v4.mp4">
      your browser cannot play this video.
    </video>
    <div class="note" style="margin-bottom:0">If the video does not appear, copy <code>ICS_Plant_Simulation_Narrated_v4.mp4</code>
      into the <code>web/tools/</code> folder next to this site (it is in FINAL/3_Videos).</div>
  </div>
  <h2 class="sec">Project poster (A1)</h2>
  <iframe class="frame" src="tools/ICS_Guardian_Poster_A1.html" title="Project poster"></iframe>
</main><script src="assets/app.js?v=9"></script></body></html>

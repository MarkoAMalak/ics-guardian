# Test-only PostgreSQL for the k8s-e2e CI job: the shared user/settings store of all replicas.
# In production use a managed, backed-up database and a strong password.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ics-postgres
spec:
  replicas: 1
  selector:
    matchLabels: {app: ics-postgres}
  template:
    metadata:
      labels: {app: ics-postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_USER, value: ics}
            - {name: POSTGRES_DB, value: ics}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: ics-postgres-pw, key: password}}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "ics"]}
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ics-postgres
spec:
  selector: {app: ics-postgres}
  ports: [{port: 5432, targetPort: 5432}]

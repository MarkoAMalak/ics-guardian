# DevSecOps pipeline - "shift-left" security for the ICS detection platform.
#
# Every push / PR runs the full gate: lint -> unit tests -> SAST (Bandit) ->
# dependency CVE scan (pip-audit) -> secret scan (Gitleaks) -> build image ->
# container CVE scan (Trivy). Nothing ships unless the security gates pass.
#
# This is the "Sec" in DevSecOps: security checks are part of CI, not a manual
# afterthought. Results are uploaded so failures are visible on the PR.

name: DevSecOps

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------- #
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/detection_service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest httpx

      - name: Lint (ruff, whole platform)
        run: ruff check ..

      - name: Unit tests (pytest)
        run: pytest -q

  # ----------------------------------------------------------------- #
  sast:
    name: SAST - Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Bandit
        run: pip install bandit[sarif]
      - name: Run Bandit
        # -ll = report medium+ severity; fail the build on findings
        run: bandit -r platform/detection_service -ll -f txt

  # ----------------------------------------------------------------- #
  dependency-scan:
    name: Dependency CVE Scan - pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit dependencies
        run: pip-audit -r platform/detection_service/requirements.txt --strict

  # ----------------------------------------------------------------- #
  secret-scan:
    name: Secret Scan - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  # ----------------------------------------------------------------- #
  container-scan:
    name: Build & Scan Image - Trivy
    runs-on: ubuntu-latest
    needs: [lint-and-test, sast, dependency-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ics-detector:${{ github.sha }} platform/detection_service

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ics-detector:${{ github.sha }}
          format: table
          exit-code: "1"                 # fail on findings
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library

      - name: Trivy config/IaC scan (Dockerfile misconfig)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: config
          scan-ref: platform/detection_service
          exit-code: "1"
          severity: CRITICAL,HIGH
